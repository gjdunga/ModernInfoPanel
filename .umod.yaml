description: >-
  Configurable corner HUD panels for Rust: clock, rotating announcements,
  balance, points, coordinates, compass, online/sleeper counts and live event
  indicators (airdrop, helicopter, chinook, cargo ship, bradley, radiation).
  Oxide and Carbon compatible, with a reflection-free API for custom panels.
